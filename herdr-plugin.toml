id = "herdr.agent-messenger"
name = "HAM"
version = "0.8.0"
min_herdr_version = "0.8.0"
description = "Label Herdr agents and coordinate prompts with HAM, the Herdr Agent Messenger."
platforms = ["macos", "linux"]

[[actions]]
id = "label-current"
title = "Assign Agent Label"
description = "Assign a color-animal name to the agent in the focused pane."
contexts = ["pane"]
command = ["python3", "agent_labels.py", "label"]

[[actions]]
id = "message-agents"
title = "HAM: Send Prompt to Agents"
description = "Select agents, then delegate through the coordinator or send directly."
contexts = ["pane"]
command = ["python3", "agent_messenger.py", "launch"]

[[actions]]
id = "agent-skill-guide"
title = "HAM Skill"
description = "Install, update, or learn how to use HAM."
contexts = ["workspace", "pane"]
command = ["python3", "agent_skill_installer.py", "launch"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "agent_labels.py", "event"]

[[panes]]
id = "messenger"
title = "HAM"
placement = "popup"
command = ["python3", "agent_messenger.py", "popup"]

[[panes]]
id = "skill-installer"
title = "HAM Skill"
placement = "popup"
command = ["python3", "agent_skill_installer.py", "popup"]
