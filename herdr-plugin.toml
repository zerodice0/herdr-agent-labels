id = "herdr.agent-labels"
name = "Agent Labels"
version = "0.5.1"
min_herdr_version = "0.8.0"
description = "Label Herdr agents and delegate or send prompts to local or SSH-hosted peers."
platforms = ["macos", "linux"]

[[actions]]
id = "label-current"
title = "Assign Agent Label"
description = "Assign a color-animal name to the agent in the focused pane."
contexts = ["pane"]
command = ["python3", "agent_labels.py", "label"]

[[actions]]
id = "message-agents"
title = "Send Prompt to Agents"
description = "Select agents, then delegate through the coordinator or send directly."
contexts = ["pane"]
command = ["python3", "agent_messenger.py", "launch"]

[[actions]]
id = "agent-skill-guide"
title = "Agent Skill Guide"
description = "Show how Codex or Claude can message agents by host and label."
contexts = ["workspace", "pane"]
command = ["python3", "agent_messenger.py", "guide-launch"]

[[actions]]
id = "install-agent-skill"
title = "Install Agent Skill"
description = "Install or update Agent Messenger for Codex, Claude, or both."
contexts = ["workspace", "pane"]
command = ["python3", "agent_skill_installer.py", "launch"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "agent_labels.py", "event"]

[[panes]]
id = "messenger"
title = "Agent Messenger"
placement = "popup"
command = ["python3", "agent_messenger.py", "popup"]

[[panes]]
id = "skill-guide"
title = "Agent Skill Guide"
placement = "popup"
command = ["python3", "agent_messenger.py", "guide"]

[[panes]]
id = "skill-installer"
title = "Install Agent Skill"
placement = "popup"
command = ["python3", "agent_skill_installer.py", "popup"]
